name: Update Formula

permissions:
  contents: write

on:
  repository_dispatch:
    types: [release-published]

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout tap
      uses: actions/checkout@v6

    - name: Get release info
      id: release
      env:
        VERSION: ${{ github.event.client_payload.version }}
      run: |
        # Strip leading 'v' if present
        CLEAN_VERSION="${VERSION#v}"
        echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

        # Download checksums — fail if assets return 404 or content is not a 64-char hex string
        BASE_URL="https://github.com/amberframework/amber_cli/releases/download/${VERSION}"

        curl -fsSL "${BASE_URL}/amber_cli-darwin-arm64.tar.gz.sha256" -o darwin.sha256 || {
          echo "ERROR: failed to download darwin sha256 for ${VERSION}" >&2; exit 1
        }
        curl -fsSL "${BASE_URL}/amber_cli-linux-x86_64.tar.gz.sha256" -o linux.sha256 || {
          echo "ERROR: failed to download linux sha256 for ${VERSION}" >&2; exit 1
        }

        DARWIN_SHA="$(cut -d' ' -f1 < darwin.sha256)"
        LINUX_SHA="$(cut -d' ' -f1 < linux.sha256)"

        # Validate: must be exactly 64 lowercase hex characters
        if ! echo "${DARWIN_SHA}" | grep -qE '^[0-9a-f]{64}$'; then
          echo "ERROR: darwin sha256 is not a valid 64-char hex string: '${DARWIN_SHA}'" >&2
          exit 1
        fi
        if ! echo "${LINUX_SHA}" | grep -qE '^[0-9a-f]{64}$'; then
          echo "ERROR: linux sha256 is not a valid 64-char hex string: '${LINUX_SHA}'" >&2
          exit 1
        fi

        echo "darwin_sha256=${DARWIN_SHA}" >> $GITHUB_OUTPUT
        echo "linux_sha256=${LINUX_SHA}" >> $GITHUB_OUTPUT

    - name: Update formula
      env:
        VERSION: ${{ steps.release.outputs.version }}
        DARWIN_SHA: ${{ steps.release.outputs.darwin_sha256 }}
        LINUX_SHA: ${{ steps.release.outputs.linux_sha256 }}
      run: |
        cat > Formula/amber_cli.rb << FORMULA
        class AmberCli < Formula
          desc "Command-line tool and LSP for the Amber web framework (Crystal)"
          homepage "https://amberframework.org"
          license "MIT"
          version "${VERSION}"

          depends_on "crystal"
          depends_on "libpq"
          depends_on "mysql-client"
          depends_on "openssl@3"
          depends_on "sqlite"

          conflicts_with "amber", because: "both install the amber binary"

          on_macos do
            if Hardware::CPU.arm?
              url "https://github.com/amberframework/amber_cli/releases/download/v${VERSION}/amber_cli-darwin-arm64.tar.gz"
              sha256 "${DARWIN_SHA}"
            end
          end

          on_linux do
            if Hardware::CPU.intel?
              url "https://github.com/amberframework/amber_cli/releases/download/v${VERSION}/amber_cli-linux-x86_64.tar.gz"
              sha256 "${LINUX_SHA}"
            end
          end

          def install
            bin.install "amber"
            bin.install "amber-lsp"
          end

          test do
            assert_match "Amber CLI v${VERSION}", shell_output("#{bin}/amber --version")
            raise "amber-lsp binary is missing" unless (bin/"amber-lsp").exist?
            raise "amber-lsp binary is not executable" unless (bin/"amber-lsp").executable?
            system "#{bin}/amber", "new", "brew_test_app", "--type", "web", "-y", "--no-deps"
            raise "Amber app scaffold did not generate shard.yml" unless (testpath/"brew_test_app"/"shard.yml").exist?
            raise "Amber app scaffold did not generate .amber.yml" unless (testpath/"brew_test_app"/".amber.yml").exist?
            shard = (testpath/"brew_test_app"/"shard.yml").read
            config = (testpath/"brew_test_app"/".amber.yml").read
            assert_match "github: amberframework/amber", shard
            assert_match "version: 2.0.0-beta.1", shard
            assert_match "template: ecr", config
            refute_match(/crimson-knight|grant:|gemma:|slang/i, shard + config)
          end
        end
        FORMULA

        # Fix indentation (heredoc adds leading spaces)
        sed -i 's/^        //' Formula/amber_cli.rb

    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Formula/amber_cli.rb
        git commit -m "Update amber_cli to ${VERSION}"
        git push
