name: Validate Install

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  install-smoke:
    name: Install Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
    - name: Checkout tap
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Check beta contract
      run: scripts/check_beta_contract.sh

    - name: Ensure Homebrew (Linux)
      if: runner.os == 'Linux'
      run: |
        if ! command -v brew >/dev/null 2>&1; then
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        fi
        echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
        echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

    - name: Show Environment
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        fi
        brew --version
        uname -a
        uname -m

    - name: Install Amber CLI
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        fi
        brew trust --tap amberframework/amber_cli
        brew tap amberframework/amber_cli "$GITHUB_WORKSPACE"
        tap_path="$(brew --repo amberframework/amber_cli)"
        test "$(git -C "$tap_path" rev-parse HEAD)" = "$GITHUB_SHA"
        brew install amberframework/amber_cli/amber_cli
        brew test amber_cli
        amber --version
        test -x "$(command -v amber-lsp)"
        crystal --version
        minecart --version

    - name: Verify macOS runtime linkage
      if: runner.os == 'macOS'
      run: |
        otool -L "$(command -v amber)"
        otool -L "$(command -v amber-lsp)"
        ! otool -L "$(command -v amber)" "$(command -v amber-lsp)" | grep -F 'openssl@1.1'

    - name: Scaffold and Build Web App
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        fi
        mkdir smoke
        cd smoke
        amber new smoke_app --type web -y
        test -f smoke_app/shard.yml
        test -f smoke_app/.amber.yml
        test -f smoke_app/shard.lock
        test -f smoke_app/.minecart-policy.yml
        test -f smoke_app/.claude/CLAUDE.md
        cd smoke_app
        grep -F 'github: amberframework/amber' shard.yml
        grep -F 'version: 2.0.0-beta.' shard.yml
        grep -F 'grant:' shard.yml
        grep -F 'github: crimson-knight/grant' shard.yml
        grep -F 'sqlite3:' shard.yml
        grep -F 'database: sqlite' .amber.yml
        grep -F 'model: grant' .amber.yml
        grep -F 'template: ecr' .amber.yml
        if grep -Eiq 'gemma:|slang' shard.yml .amber.yml; then
          exit 1
        fi
        grep -F 'require_exact: true' .minecart-policy.yml
        test "$(grep -c 'checksum: git-tree:' shard.lock)" -eq "$(grep -c '^  [a-z_][a-z_0-9]*:$' shard.lock)"
        minecart install --frozen --skip-ai-docs
        amber generate scaffold Pet name:string:required species:string:required adopted:bool
        amber database migrate
        env AMBER_ENV=test amber database migrate
        amber assets check
        crystal spec
        crystal build src/smoke_app.cr -o bin/smoke_app

    - name: Launch and probe Web App
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        fi
        cd smoke/smoke_app
        AMBER_SERVER_PORT=3210 ./bin/smoke_app >server.log 2>&1 &
        server_pid="$!"
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        ready="false"
        for ((attempt = 1; attempt <= 30; attempt++)); do
          if curl --fail --silent http://127.0.0.1:3210/ >homepage.html; then
            ready="true"
            break
          fi
          sleep 1
        done
        if [ "$ready" != "true" ]; then
          cat server.log
          exit 1
        fi
        grep -F 'Your new idea' homepage.html
        grep -F 'locally served CSS and JavaScript' homepage.html
        asset_path() {
          ruby -rjson -e 'manifest = JSON.parse(File.read(ARGV[0])); puts manifest.fetch("assets").fetch(ARGV[1]).fetch("path")' \
            public/assets/manifest.json "$1"
        }
        css_url="$(asset_path stylesheets/app.css)"
        js_url="$(asset_path javascript/app.js)"
        logo_url="$(asset_path images/amber-crystal.svg)"
        test -n "$css_url"
        test -n "$js_url"
        test -n "$logo_url"
        grep -F "\"app\":\"$js_url\"" homepage.html
        grep -F 'integrity="sha256-' homepage.html
        grep -F "$logo_url" "public/${css_url#/}"
        curl --fail --silent --dump-header css.headers "http://127.0.0.1:3210$css_url" | grep -F -- '--amber-accent: #e96918'
        grep -Fi 'Content-Type: text/css' css.headers
        grep -Fi 'Cache-Control: public, max-age=31536000, immutable' css.headers
        curl --fail --silent --dump-header js.headers "http://127.0.0.1:3210$js_url" | grep -F 'document.documentElement.dataset.javascript = "ready";'
        grep -Fi 'Content-Type: text/javascript' js.headers
        curl --fail --silent --dump-header logo.headers "http://127.0.0.1:3210$logo_url" | grep -F '<svg'
        grep -Fi 'Content-Type: image/svg+xml' logo.headers
        curl --fail --silent http://127.0.0.1:3210/pets | grep -F 'Pets'
        kill "$server_pid"
        wait "$server_pid" || true
        trap - EXIT
