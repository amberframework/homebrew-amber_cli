name: Validate Install

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  install-smoke:
    name: Install Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
    - name: Checkout tap
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Check beta contract
      run: scripts/check_beta_contract.sh

    - name: Ensure Homebrew (Linux)
      if: runner.os == 'Linux'
      run: |
        if ! command -v brew >/dev/null 2>&1; then
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        fi
        echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
        echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

    - name: Show Environment
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        fi
        brew --version
        uname -a
        uname -m

    - name: Install Amber CLI
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        fi
        brew install amberframework/amber_cli/amber_cli
        brew test amber_cli
        amber --version
        test -x "$(command -v amber-lsp)"
        crystal --version
        shards --version

    - name: Verify macOS runtime linkage
      if: runner.os == 'macOS'
      run: |
        otool -L "$(command -v amber)"
        otool -L "$(command -v amber-lsp)"
        ! otool -L "$(command -v amber)" "$(command -v amber-lsp)" | grep -F 'openssl@1.1'

    - name: Scaffold and Build Web App
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        fi
        mkdir smoke
        cd smoke
        amber new smoke_app --type web -y --no-deps
        test -f smoke_app/shard.yml
        test -f smoke_app/.amber.yml
        cd smoke_app
        grep -F 'github: amberframework/amber' shard.yml
        grep -F 'version: 2.0.0-beta.' shard.yml
        grep -F 'grant:' shard.yml
        grep -F 'github: crimson-knight/grant' shard.yml
        grep -F 'sqlite3:' shard.yml
        grep -F 'database: sqlite' .amber.yml
        grep -F 'model: grant' .amber.yml
        grep -F 'template: ecr' .amber.yml
        ! grep -Eiq 'gemma:|slang' shard.yml .amber.yml
        shards install
        amber generate scaffold Pet name:string:required species:string:required adopted:bool
        amber database migrate
        AMBER_ENV=test amber database migrate
        crystal spec
        crystal build src/smoke_app.cr -o bin/smoke_app

    - name: Launch and probe Web App
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        fi
        cd smoke/smoke_app
        AMBER_SERVER_PORT=3210 ./bin/smoke_app >server.log 2>&1 &
        server_pid="$!"
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        ready=false
        for attempt in {1..30}; do
          if curl --fail --silent http://127.0.0.1:3210/ >homepage.html; then
            ready=true
            break
          fi
          sleep 1
        done
        if [ "$ready" != "true" ]; then
          cat server.log
          exit 1
        fi
        grep -F 'Your new idea' homepage.html
        grep -F 'locally served CSS and JavaScript' homepage.html
        grep -F '{"imports":{"app":"/js/app.js"}}' homepage.html
        curl --fail --silent http://127.0.0.1:3210/css/app.css | grep -F -- '--amber-accent: #e96918'
        curl --fail --silent http://127.0.0.1:3210/pets | grep -F 'Pets'
        kill "$server_pid"
        wait "$server_pid" || true
        trap - EXIT
